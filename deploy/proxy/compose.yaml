name: proxy
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./conf:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  caddy_data:
  caddy_config:
networks:
  proxy:
    external: true
    name: proxy
